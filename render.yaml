services:
  - type: web
    name: binance-test
    runtime: python
    region: singapore
    plan: free
    autoDeploy: true

    envVars:
      PYTHON_VERSION: 3.11.9

    buildCommand: python -m pip install --upgrade pip && pip install -r requirements.txt --no-cache-dir

    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
