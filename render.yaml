services:
  - type: web
    name: binance-test
    runtime: python               # 2025 年写法，代替旧的 env: python
    region: singapore
    plan: free
    autoDeploy: true

    envVars:
      PYTHON_VERSION: 3.11.9      # 锁死版本，永不翻车

    buildCommand: python -m pip install --upgrade pip && pip install -r requirements.txt --no-cache-dir

    # 下面这行是目前最稳的写法，兼容所有情况
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
