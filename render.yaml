services:
  - type: web
    name: binance-test
    runtime: python
    region: singapore
    plan: free
    autoDeploy: true

    envVars:
      PYTHON_VERSION: 3.11.9  # 固定 3.11，兼容性最佳

    # 修复 pip 升级通知 + 强制安装 + 验证（这次会打印成功）
    buildCommand: python -m pip install --upgrade pip && pip install -r requirements.txt --no-cache-dir --force-reinstall && python -c "from binance.um_futures import UMFutures; print('✅ Binance Futures import SUCCESS!')"

    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
